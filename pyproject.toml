[project]
name = "newsroom-agents"
version = "0.1.0"
description = "Multi-agent newsroom: researcher, summarizer, fact-verifier and editor. Runs on Colab's free T4."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "feedparser", "requests", "trafilatura", "googlenewsdecoder"]

[project.optional-dependencies]
local = ["torch", "transformers", "accelerate", "bitsandbytes"]
claude = ["anthropic"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
